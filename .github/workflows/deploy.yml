name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/journal

            echo ">>> Backing up server/.env..."
            ENV_BACKUP_DIR="$(mktemp -d)"
            [ -f server/.env ] && cp server/.env "$ENV_BACKUP_DIR/server.env"

            # The server is a mirror of origin/main, never a place where work
            # happens. Hard reset instead of `git pull --ff-only` so the deploy
            # still succeeds after a force-push, and so build output never
            # blocks it.
            echo ">>> Syncing working tree to origin/main..."
            git fetch origin main
            git reset --hard FETCH_HEAD

            echo ">>> Restoring server/.env..."
            [ -f "$ENV_BACKUP_DIR/server.env" ] && cp "$ENV_BACKUP_DIR/server.env" server/.env
            rm -rf "$ENV_BACKUP_DIR"

            echo ">>> Building client..."
            cd client
            npm ci || { echo "WARNING: npm ci failed; falling back to npm install"; npm install; }
            npm run build
            cd ..

            echo ">>> Backing up database before backend migration/restart..."
            mkdir -p backups
            PG_ID="$(docker compose -f docker-compose.prod.yml ps -q postgres || true)"
            if [ -n "$PG_ID" ] && [ "$(docker inspect -f '{{.State.Running}}' "$PG_ID" 2>/dev/null || echo false)" = "true" ]; then
              docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql"
            else
              echo "Postgres is not running yet; skipping pre-deploy database backup."
            fi

            echo ">>> Rebuilding and restarting backend (migrations run automatically)..."
            docker compose -f docker-compose.prod.yml up --build -d backend

            # Recreate rather than reload: client/dist is bind-mounted into
            # nginx, and the build above replaced that directory. A plain
            # `nginx -s reload` would keep serving the stale mount.
            echo ">>> Restarting nginx..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate nginx

            echo ">>> Verifying backend is healthy..."
            BACKEND_ID="$(docker compose -f docker-compose.prod.yml ps -q backend || true)"
            if [ -z "$BACKEND_ID" ]; then
              echo "ERROR: backend container was not created. Check logs: docker compose -f docker-compose.prod.yml logs backend"
              exit 1
            fi
            STATUS="unknown"
            for i in 1 2 3 4 5 6; do
              sleep 5
              STATUS="$(docker inspect -f '{{.State.Status}}' "$BACKEND_ID" 2>/dev/null || echo unknown)"
              if [ "$STATUS" = "running" ]; then
                echo "Backend is running."
                break
              fi
              echo "Attempt $i: backend status is '$STATUS', waiting..."
            done
            if [ "$STATUS" != "running" ]; then
              echo "ERROR: Backend failed to start. Check logs: docker compose -f docker-compose.prod.yml logs backend"
              exit 1
            fi

            echo ">>> Health check..."
            curl -fsS https://ijidcr-asgard.in/api/health

            echo ">>> All done! Deployment successful."
