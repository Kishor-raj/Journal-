# ─────────────────────────────────────────────────────────────────────────────
# Journal- (Asgard Publications / IJIDCR) — Nginx Configuration
# Single domain: ijidcr-asgard.in — serves the client SPA and reverse-proxies
# /api/* to the backend container. No separate admin subdomain.
# ─────────────────────────────────────────────────────────────────────────────

upstream journal_backend {
    server backend:3001;
    keepalive 32;
}

# ─── Step 1 (HTTP): Serve certbot challenge + redirect everything else to HTTPS
server {
    listen 80;
    server_name ijidcr-asgard.in www.ijidcr-asgard.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── App: https://ijidcr-asgard.in ──────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name ijidcr-asgard.in www.ijidcr-asgard.in;

    ssl_certificate     /etc/letsencrypt/live/ijidcr-asgard.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ijidcr-asgard.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/journal;
    index index.html;

    include /etc/nginx/conf.d/security.inc;

    # Never cache index.html — it references hashed assets, stale copies cause 404s on CSS/JS
    location = /index.html {
        include /etc/nginx/conf.d/security.inc;  # re-include: nginx drops parent add_header here
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        expires 0;
    }

    # Static assets — cache aggressively (Vite adds content hashes to filenames)
    location /assets/ {
        include /etc/nginx/conf.d/security.inc;  # re-include: nginx drops parent add_header here
        expires     1y;
        add_header  Cache-Control "public, immutable" always;
    }

    # Backend API reverse proxy
    location /api/ {
        proxy_pass          http://journal_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_cookie_path   / /;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # React SPA — serve index.html for all unknown paths (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
