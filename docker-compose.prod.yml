# Production stack for the Hostinger VPS.
# The plain docker-compose.yml stays local-dev-only (Postgres for `npm run dev`).
# On the VPS this file runs instead: postgres + backend, on a private
# journal-net network. There is no nginx service here — the shared reverse
# proxy in /var/www/proxy (container "proxy", external network "web") is
# what's actually published on ports 80/443 for every site on this VPS,
# including this one (see /var/www/proxy/conf.d/journal.conf). The backend
# joins that "web" network too, so proxy can resolve it by container name
# ("journal-backend:3001") — without it, proxy gets DNS failures / 502s.
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: journal-postgres
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:5433:5432"   # host-only, for manual psql/backups — never public
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - journal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: journal-backend
    restart: always
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3001"   # optional, host-only debugging (curl localhost:3002/api/health)
    networks:
      - journal-net
      - web

networks:
  journal-net:
    driver: bridge
  web:
    external: true   # shared with /var/www/proxy — lets it resolve journal-backend by name

volumes:
  postgres_data:
