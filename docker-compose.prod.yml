# Production stack for the Hostinger VPS.
# The plain docker-compose.yml stays local-dev-only (Postgres for `npm run dev`).
# On the VPS this file runs instead: postgres + backend + nginx, all on one
# private network. Only nginx is published to the internet.
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: journal-postgres
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:5433:5432"   # host-only, for manual psql/backups — never public
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - journal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: journal-backend
    restart: always
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3001"   # optional, host-only debugging (curl localhost:3002/api/health)
    networks:
      - journal-net

  nginx:
    image: nginx:1.27-alpine
    container_name: journal-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./client/dist:/var/www/journal:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - journal-net

networks:
  journal-net:
    driver: bridge

volumes:
  postgres_data:
